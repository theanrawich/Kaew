<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaew telemetry</title><style>
body{font:16px system-ui;background:#edf4f2;color:#183b39;margin:0;padding:2rem}main{max-width:960px;margin:auto}h1{font-size:2rem}section{background:white;border-radius:14px;padding:1.2rem;margin:1rem 0;box-shadow:0 6px 24px #1232}input,button{font:inherit;padding:.6rem;border:1px solid #9db9b2;border-radius:6px}button{background:#135d51;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.55rem;border-bottom:1px solid #e1eae7}small{color:#526c67}.scroll{overflow:auto}
</style></head><body><main><h1>Kaew telemetry</h1><p>ข้อมูลเซนเซอร์ที่บันทึกจริงในฐานข้อมูลทดลอง · ไม่ใช่เครื่องมือประเมินความปลอดภัยของน้ำ</p>
<section><label>Admin token <input id="token" type="password" autocomplete="off"></label> <button id="connect">เชื่อมต่อ</button><p id="message">ยังไม่ได้เชื่อมต่อ</p><p id="status"></p></section>
<section><h2>ข้อมูลย้อนหลัง</h2><small>100 รายการล่าสุด · ADC เป็นค่าดิบ · ระดับน้ำเป็นสถานะจุดเดียว</small><div class="scroll"><table><thead><tr><th>เวลารับ</th><th>ระดับ</th><th>อุณหภูมิ °C</th><th>ADC ดิบ</th><th>ลำดับ</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
let token=''; async function refresh(){if(!token)return;try{const headers={Authorization:'Bearer '+token};const [a,b]=await Promise.all([fetch('/api/status',{headers}),fetch('/api/telemetry',{headers})]);if(!a.ok||!b.ok)throw Error('เข้าสู่ระบบไม่สำเร็จ');const s=await a.json(),t=await b.json();document.querySelector('#status').textContent=s.device.id+' · '+(s.device.online?'ออนไลน์':'ออฟไลน์');const rows=document.querySelector('#rows');rows.replaceChildren(...t.items.map(item=>{const tr=document.createElement('tr');for(const value of [new Date(item.received_at*1000).toLocaleString(),item.level,item.temperature_c??'—',item.tds_adc,item.seq]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}return tr}));document.querySelector('#message').textContent='เชื่อมต่อแล้ว';}catch(e){document.querySelector('#message').textContent='เชื่อมต่อไม่ได้: '+e.message;}}
document.querySelector('#connect').onclick=()=>{token=document.querySelector('#token').value;document.querySelector('#token').value='';refresh()};setInterval(refresh,5000);
</script></body></html>
