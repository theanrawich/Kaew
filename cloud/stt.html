<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaew – Live STT test</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#fffbe6;color:#111}
h1{font-size:22px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,select,input{font:inherit;padding:10px 16px;border:3px solid #111;background:#fff;box-shadow:4px 4px 0 #111;cursor:pointer}
button.on{background:#ff5c5c;color:#fff}
#box{border:3px solid #111;background:#fff;min-height:200px;padding:14px;font-size:22px;line-height:1.5;box-shadow:6px 6px 0 #111}
#interim{color:#888}
#status{margin:10px 0;font-size:14px}
</style></head><body>
<h1>🎤 Kaew – Live speech-to-text test</h1>
<div class="row">
<select id="mode"><option value="browser">Browser Web Speech</option><option value="groq">Groq Whisper (cloud)</option></select>
<input id="token" type="password" autocomplete="off" placeholder="Admin token" aria-label="Admin token" hidden>
<select id="lang"><option value="th-TH">ไทย (th-TH)</option><option value="en-US">English (en-US)</option></select>
<button id="mic">Start</button><button id="clear">Clear</button>
</div>
<div id="status">Uses the browser's built-in speech recognition (Chrome, Edge or Safari). Nothing is stored.</div>
<div id="box"><span id="final"></span><span id="interim"></span></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id), status=$('status');
let rec=null, on=false;
if(!SR){status.textContent='This browser has no speech recognition. Try Chrome on desktop/Android or Safari on iPhone.';}
function startBrowser(){
  rec=new SR(); rec.lang=$('lang').value; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
    if(e.results[i].isFinal){$('final').textContent+=t+' ';}else interim+=t;} $('interim').textContent=interim;};
  rec.onerror=e=>{status.textContent='Error: '+e.error;};
  rec.onend=()=>{if(on)rec.start();};
  rec.start(); on=true; $('mic').textContent='Stop'; $('mic').classList.add('on'); status.textContent='Listening ('+rec.lang+')…';
}
function stopBrowser(){on=false; if(rec)rec.stop(); $('mic').textContent='Start'; $('mic').classList.remove('on'); status.textContent='Stopped.';}
let stream=null, context=null, source=null, processor=null, timer=null, buffers=[], count=0, queue=Promise.resolve();
try{$('token').value=sessionStorage.getItem('kaew-stt-admin')||'';}catch(e){}
$('token').oninput=()=>{try{sessionStorage.setItem('kaew-stt-admin',$('token').value);}catch(e){}};
function wav(samples,rate){
  const ratio=rate/16000, n=Math.floor(samples.length/ratio), pcm=new Int16Array(n);
  let energy=0;
  for(let i=0;i<n;i++){
    // Average each source interval to downsample the mono microphone signal.
    const begin=Math.floor(i*ratio), end=Math.min(samples.length,Math.floor((i+1)*ratio));
    let value=0;
    for(let j=begin;j<end;j++)value+=samples[j];
    value=Math.max(-1,Math.min(1,value/Math.max(1,end-begin)));
    pcm[i]=Math.round(value*(value<0?32768:32767)); energy+=pcm[i]*pcm[i];
  }
  if(!n||Math.sqrt(energy/n)<100)return null;
  const bytes=new ArrayBuffer(44+n*2), view=new DataView(bytes);
  function label(offset,text){for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i));}
  label(0,'RIFF');view.setUint32(4,36+n*2,true);label(8,'WAVE');label(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
  label(36,'data');view.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)view.setInt16(44+i*2,pcm[i],true);
  return bytes;
}
function flush(){
  if(!count||!context)return;
  const samples=new Float32Array(count);let offset=0;
  for(const buffer of buffers){samples.set(buffer,offset);offset+=buffer.length;}
  buffers=[];count=0;
  const body=wav(samples,context.sampleRate);
  if(!body)return;
  const token=$('token').value.trim().replace(/^"|"$/g,'');
  queue=queue.then(async()=>{
    const response=await fetch('/api/stt',{method:'POST',headers:{'Content-Type':'audio/wav','Authorization':'Bearer '+token},body});
    if(!response.ok)throw new Error('Cloud transcription failed ('+response.status+').');
    const result=await response.json();
    $('final').textContent+=result.text+' ';
  }).catch(e=>{status.textContent=e.message;});
}
async function startCloud(){
  if(!$('token').value){status.textContent='Enter the admin token first.';return;}
  $('mic').disabled=true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1},video:false});
    context=new (window.AudioContext||window.webkitAudioContext)();
    await context.resume();
    source=context.createMediaStreamSource(stream);
    processor=context.createScriptProcessor(4096,1,1);
    processor.onaudioprocess=e=>{
      if(!on)return;
      const chunk=new Float32Array(e.inputBuffer.getChannelData(0));
      buffers.push(chunk);count+=chunk.length;
      if(count>=context.sampleRate*4)flush();
    };
    source.connect(processor);processor.connect(context.destination);
    on=true;timer=setInterval(flush,4000);
    $('mode').disabled=true;$('lang').disabled=true;$('token').disabled=true;
    $('mic').textContent='Stop';$('mic').classList.add('on');
    status.textContent='Listening with Groq Whisper… Audio is sent to the cloud in short chunks (Thai).';
  }catch(e){await stopCloud();status.textContent='Microphone unavailable. Allow microphone access on HTTPS or localhost.';}
  finally{$('mic').disabled=false;}
}
async function stopCloud(){
  $('mic').disabled=true;
  on=false;clearInterval(timer);flush();
  if(processor){processor.disconnect();processor.onaudioprocess=null;processor=null;}
  if(source){source.disconnect();source=null;}
  if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}
  if(context){await context.close();context=null;}
  $('mic').textContent='Start';$('mic').classList.remove('on');
  $('mode').disabled=false;$('lang').disabled=false;$('token').disabled=false;
  status.textContent='Stopped. Finishing pending transcription…';
  $('mic').disabled=false;
}
function start(){if($('mode').value==='groq')return startCloud();if(SR)return startBrowser();status.textContent='Web Speech unavailable; choose Groq Whisper.';}
function stop(){return $('mode').value==='groq'?stopCloud():stopBrowser();}
$('mic').onclick=()=>on?stop():start();
$('mode').onchange=()=>{if(on)stopBrowser();$('token').hidden=$('mode').value!=='groq';$('lang').hidden=$('mode').value==='groq';};
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(track=>track.stop());});
$('clear').onclick=()=>{$('final').textContent='';$('interim').textContent='';};
$('lang').onchange=()=>{if(on){stop();start();}};
</script></body></html>
