# Set a unique app name via --app / KAEW_FLY_APP; no secrets belong here.
primary_region = "sin"

[build]
  dockerfile = "cloud/Dockerfile"

[env]
  KAEW_HOST = "0.0.0.0"
  KAEW_TRUST_EDGE_HTTPS = "1"
  PORT = "8080"
  # DATABASE_URL and both tokens must be provided as secrets, not committed.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
