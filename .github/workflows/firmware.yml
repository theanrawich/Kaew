name: Firmware and simulator checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulator tests
        run: node --test simulation/*.test.mjs
      - name: Cloud API and pipeline tests
        run: python -m unittest discover -s cloud -p 'test_*.py' -v
      - name: Host safety tests
        run: python scripts/run_host_tests.py
      - name: Measurement analysis tests (synthetic unit fixtures only)
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build both firmware targets
        run: pio run -d firmware
      - name: Compile gateway publisher enabled
        run: pio run -d firmware -e gateway_cloud_compile
      - name: Compile measurement trace builds (pump disabled)
        run: pio run -d firmware -e sensor_node_trace -e gateway_trace
      - name: Compile locally confirmed AI pull path (pump disabled)
        run: pio run -d firmware -e gateway_ai_compile
