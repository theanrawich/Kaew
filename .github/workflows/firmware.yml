name: Firmware and simulator checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulator tests
        run: node --test simulation/*.test.mjs
      - name: Cloud API and pipeline tests
        run: python -m unittest discover -s cloud -p 'test_*.py' -v
      - name: Host safety tests
        run: |
          g++ -std=c++17 -Ifirmware/include firmware/test/safety_test.cpp -o /tmp/kaew-safety-test
          /tmp/kaew-safety-test
          g++ -std=c++17 -Ifirmware/include firmware/test/scale_test.cpp -o /tmp/kaew-scale-test
          /tmp/kaew-scale-test
          g++ -std=c++17 -Ifirmware/include firmware/test/protocol_test.cpp -o /tmp/kaew-protocol-test
          /tmp/kaew-protocol-test
          g++ -std=c++17 -Ifirmware/include firmware/test/integration_test.cpp -o /tmp/kaew-integration-test
          /tmp/kaew-integration-test
          g++ -std=c++17 -Ifirmware/include firmware/test/dispense_test.cpp -o /tmp/kaew-dispense-test
          /tmp/kaew-dispense-test
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build both firmware targets
        run: pio run -d firmware
      - name: Compile gateway publisher enabled
        run: pio run -d firmware -e gateway_cloud_compile
