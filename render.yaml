services:
  - type: web
    name: kaew-cloud
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r cloud/requirements.txt
    startCommand: python cloud/server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: KAEW_HOST
        value: 0.0.0.0
      - key: KAEW_TRUST_EDGE_HTTPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: KAEW_DEVICE_TOKEN
        sync: false
      - key: KAEW_ADMIN_TOKEN
        sync: false
