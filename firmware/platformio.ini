[platformio]
default_envs = sensor_node, gateway

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
  bogde/HX711@0.7.5

[env:sensor_node]
board = esp32dev
build_src_filter = +<node.cpp>

[env:gateway]
board = kaew_s3_n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<gateway.cpp>

[env:gateway_cloud_compile]
extends = env:gateway
build_flags = -DKAEW_CLOUD_ENABLED=1 -DKAEW_AUDIO_ENABLED=1

; Measurement-only builds. Pump commissioning remains disabled.
[env:sensor_node_trace]
extends = env:sensor_node
build_flags = -DKAEW_PACKET_TRACE_ENABLED=1

[env:gateway_trace]
extends = env:gateway
build_flags = -DKAEW_PACKET_TRACE_ENABLED=1

; Compile the opt-in AI pull path; physical commissioning remains 0.
[env:gateway_ai_compile]
extends = env:gateway
build_flags = -DKAEW_CLOUD_ENABLED=1 -DKAEW_AI_REFILL_ENABLED=1
