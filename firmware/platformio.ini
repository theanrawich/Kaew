[platformio]
default_envs = sensor_node, gateway

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
  bogde/HX711@0.7.5

[env:sensor_node]
board = kaew_s3_n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<node.cpp>

[gateway_oled]
build_flags =
  -DKAEW_OLED_SDA=17
  -DKAEW_OLED_SCL=18
  -DKAEW_OLED_ADDRESS=0x3C
  -DKAEW_OLED_DRIVER=1306

[env:gateway]
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@2.36.12
build_flags = ${gateway_oled.build_flags}
board = kaew_s3_n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<gateway.cpp>
upload_port = COM15
monitor_port = COM15

[env:gateway_cloud_compile]
extends = env:gateway
build_flags = ${gateway_oled.build_flags} -DKAEW_CLOUD_ENABLED=1 -DKAEW_AUDIO_ENABLED=1

; Measurement-only builds. Pump commissioning remains disabled.
[env:sensor_node_trace]
extends = env:sensor_node
build_flags = -DKAEW_PACKET_TRACE_ENABLED=1

[env:gateway_trace]
extends = env:gateway
build_flags = ${gateway_oled.build_flags} -DKAEW_PACKET_TRACE_ENABLED=1

; Compile the opt-in AI pull path; physical commissioning remains 0.
[env:gateway_ai_compile]
extends = env:gateway
build_flags = ${gateway_oled.build_flags} -DKAEW_CLOUD_ENABLED=1 -DKAEW_AI_REFILL_ENABLED=1

[env:mic_test]
extends = env:gateway
lib_deps = ${env.lib_deps}
build_src_filter = +<mic_test.cpp>
build_flags = -DKAEW_CLOUD_ENABLED=1 -DKAEW_AUDIO_ENABLED=1

[env:node_selftest]
extends = env:sensor_node
build_src_filter = +<node_selftest.cpp>

[env:gateway_selftest]
extends = env:gateway
build_src_filter = +<gateway_selftest.cpp>
build_flags = ${gateway_oled.build_flags}
