[platformio]
default_envs = gateway

[env:gateway]
build_src_filter = +<gateway.cpp>
platform = espressif32@6.10.0
board = kaew_s3_n16r8
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = bogde/HX711@0.7.5

[env:sensor_node]
platform = espressif32@6.10.0
board = kaew_s3_n16r8
framework = arduino
monitor_speed = 115200
build_src_filter = +<node.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DKAEW_TDS_PIN=4
  -DKAEW_LEVEL_PIN=5
  -DKAEW_LEVEL_WET_STATE=HIGH
lib_deps =
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
